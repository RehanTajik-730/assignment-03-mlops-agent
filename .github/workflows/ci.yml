name: MLOps Agent CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Type Check & Automated Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-mock pytest-cov
          pip install -e .

      - name: Lint Code with Ruff
        run: |
          ruff check . --output-format=github

      - name: Run Automated Pytest Suite
        env:
          MLFLOW_TRACKING_URI: "sqlite:///ci_mlflow.db"
          AIRFLOW_BASE_URL: "http://localhost:8080"
          ENVIRONMENT: "ci-testing"
          APP_VERSION: "v1.4.2"
          DATASET_VERSION: "v2.1"
          GIT_COMMIT: ${{ github.sha }}
        run: |
          pytest -v --cov=agent --cov-report=term-missing --cov-fail-under=80

      - name: Verify Docker Container Build
        run: |
          docker build -t mlops-inference-service:v1.4.2 .
